<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机与 AR/VR · 型号指标矩阵</title><link rel="stylesheet" href="style.css"><style>body{max-width:1280px;margin:auto;padding:24px}header{position:static;height:auto;padding:0;display:block}label{display:inline-block;margin:12px 18px 12px 0}select{max-width:100%}select[multiple]{display:block;width:100%;min-width:220px}button{margin:4px;padding:8px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{min-width:150px;max-width:240px;overflow-wrap:anywhere;padding:12px;border:1px solid #ccd5df;text-align:left;vertical-align:top}th{background:#edf3f8}th small,td small{display:block;margin-top:6px;color:#536579} .scroll{overflow:auto}.plot-scroll:focus-visible{outline:3px solid #c88443;outline-offset:3px}.chart-scroll-hint{display:none;font-size:14px;color:#536579}.chart-legend{overflow-wrap:anywhere}@media(max-width:623px){.chart-scroll-hint{display:block}}svg{width:100%;min-width:600px;height:auto;background:#f8fafc}summary{cursor:pointer}#status{padding:12px;background:#e9f2f7}h1{font-size:30px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:650px){body{padding:12px}.cols{display:block}}</style></head><body><header><a href="index.html">← 透镜评价证据库</a><h1>型号 × 指标</h1><p>手机镜头 / AR·VR 显示 · 可追溯参数与双轴机型打点</p></header><label>领域 <select id="domain"><option value="phone">手机摄像头</option><option value="xr">AR / VR 显示</option></select></label><label id="module-label">摄像头 <select id="module"><option value="main">主摄</option><option value="ultrawide">超广角</option><option value="tele">长焦</option></select></label><p id="scope"></p><div class="cols"><label>横轴指标 <select id="x"></select></label><label>纵轴指标 <select id="y"></select></label></div><div class="cols"><label>图形 <select id="mode"><option value="scatter">散点</option><option value="line">折线（按横轴数值排序）</option></select></label><label>表格排序 <select id="sort"><option value="original">目录顺序</option><option value="model">型号名称</option><option value="x">横轴指标升序</option><option value="y">纵轴指标升序</option></select></label></div><div class="cols"><label>显示型号（可多选）<select id="models" multiple size="5" aria-label="显示型号"></select></label><label>表格指标列（可多选）<select id="columns" multiple size="5" aria-label="表格指标列"></select></label></div><p><button id="all-models">全选型号</button> <button id="all-columns">全选指标列</button> <button id="export-csv">导出当前表格 CSV</button> <button id="export-svg">导出图表 SVG</button> <button id="share">复制当前视图链接</button></p><div id="status" role="status"></div><div id="chart"></div><p>每个点代表一个型号的所选模组或显示配置。散点中的细线连接圆点与标签；折线模式按横轴数值排序连接型号，仅辅助比较，不表示时间趋势、因果关系或连续物理过程。圆点保留真实坐标；缺失数据不作零，不参与该坐标绘制。厂商标称不是独立实测，不据此生成画质或体验排名。</p><h2>型号指标表</h2><div class="scroll" id="table" role="region" aria-label="型号指标表横向滚动区域" tabindex="0"></div><h2>指标词典与待补缺口</h2><div id="definitions"></div><h2>核验来源</h2><div id="sources"></div><p id="date"></p><script src="devices-data.js"></script><script src="devices.js"></script></body></html>
