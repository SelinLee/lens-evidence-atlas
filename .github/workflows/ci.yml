name: Validate evidence and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist
      - uses: actions/upload-artifact@v4
        with:
          name: private-research-site
          path: dist/
          retention-days: 14
