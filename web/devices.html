<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机与 AR/VR · 型号指标矩阵</title><link rel="stylesheet" href="style.css"><style>body{max-width:1280px;margin:auto;padding:24px}header{position:static;height:auto;padding:0;display:block}label{display:inline-block;margin:12px 18px 12px 0}select{max-width:280px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:12px;border:1px solid #ccd5df;text-align:left;vertical-align:top}th{background:#edf3f8}th small,td small{display:block;margin-top:6px;color:#536579} .scroll{overflow:auto}.plot-scroll:focus-visible{outline:3px solid #c88443;outline-offset:3px}.chart-scroll-hint{display:none;font-size:14px;color:#536579}.chart-legend{overflow-wrap:anywhere}@media(max-width:623px){.chart-scroll-hint{display:block}}svg{width:100%;min-width:600px;height:auto;background:#f8fafc}summary{cursor:pointer}#status{padding:12px;background:#e9f2f7}h1{font-size:30px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:650px){body{padding:12px}.cols{display:block}}</style></head><body><header><a href="index.html">← 透镜评价证据库</a><h1>型号 × 指标</h1><p>手机镜头 / AR·VR 显示 · 可追溯参数与双轴机型打点</p></header><label>领域 <select id="domain"><option value="phone">手机摄像头</option><option value="xr">AR / VR 显示</option></select></label><label id="module-label">摄像头 <select id="module"><option value="main">主摄</option><option value="ultrawide">超广角</option><option value="tele">长焦</option></select></label><p id="scope"></p><div class="cols"><label>横轴指标 <select id="x"></select></label><label>纵轴指标 <select id="y"></select></label></div><div id="status" role="status"></div><div id="chart"></div><p>每个点代表一个型号的所选模组或显示配置。细线仅连接圆点与其文字标签，不连接不同型号，也不表示时间趋势。圆点保留真实坐标；缺失数据不作零，不参与该坐标绘制。厂商标称不是独立实测，不据此生成画质或体验排名。</p><h2>型号指标表</h2><div class="scroll" id="table"></div><h2>指标词典与待补缺口</h2><div id="definitions"></div><h2>核验来源</h2><div id="sources"></div><p id="date"></p><script src="devices-data.js"></script><script src="devices.js"></script></body></html>
